name: Windows PowerShell checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safe-checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell scripts
        shell: powershell
        run: |
          $files = @('.\IntelWiFiBTManager.ps1')
          if (Test-Path '.\tests\RestartPrompt.Tests.ps1') { $files += '.\tests\RestartPrompt.Tests.ps1' }
          if (Test-Path '.\tests\UpdateCheck.Tests.ps1') { $files += '.\tests\UpdateCheck.Tests.ps1' }
          $files += '.\tools\Get-InfDriverReport.ps1', '.\tests\InfReport.Tests.ps1', '.\tools\Compare-InfDriverReports.ps1', '.\tests\InfCompare.Tests.ps1', '.\tools\Test-DriverPackage.ps1', '.\tests\PackageAudit.Tests.ps1', '.\tests\WorkDirectory.Tests.ps1', '.\tools\Test-DriverCatalogue.ps1', '.\tests\DriverCatalogue.Tests.ps1', '.\tools\Test-DriverCandidate.ps1', '.\tests\DriverCandidate.Tests.ps1', '.\tests\LiveInstalledCandidate.ps1', '.\tools\Test-OfficialWifiCandidate.ps1', '.\tests\OfficialWifiCandidate.Tests.ps1', '.\tools\Invoke-OfficialWifiReadOnlyCheck.ps1', '.\tests\OfficialWifiDownload.Tests.ps1'
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          }
      - name: Check graphics matching and restart prompt without installation
        if: hashFiles('tests/RestartPrompt.Tests.ps1') != ''
        shell: powershell
        run: .\tests\RestartPrompt.Tests.ps1
      - name: Check read-only update assessment parsing
        shell: powershell
        run: .\tests\UpdateCheck.Tests.ps1
      - name: Check INF report without installing drivers
        shell: powershell
        run: .\tests\InfReport.Tests.ps1
      - name: Compare INF reports without installing drivers
        shell: powershell
        run: .\tests\InfCompare.Tests.ps1
      - name: Audit package files without installation
        shell: powershell
        run: .\tests\PackageAudit.Tests.ps1
      - name: Check device candidate assessment without installation
        shell: powershell
        run: .\tests\DriverCandidate.Tests.ps1
      - name: Reject mismatched official Wi-Fi ZIP without installation
        shell: powershell
        run: .\tests\OfficialWifiCandidate.Tests.ps1
      - name: Check declining Intel ZIP download
        shell: powershell
        run: .\tests\OfficialWifiDownload.Tests.ps1
      - name: Check temporary workspace cleanup
        shell: powershell
        run: .\tests\WorkDirectory.Tests.ps1
      - name: Validate curated candidate catalogue
        shell: powershell
        run: .\tests\DriverCatalogue.Tests.ps1
      - name: Check read-only inventory with English messages
        if: hashFiles('tests/RestartPrompt.Tests.ps1') != ''
        shell: powershell
        run: .\IntelWiFiBTManager.ps1 -Inventory -Language en
